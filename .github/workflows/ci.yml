# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # The version install/quickstart.sh pins, so CI runs what a fresh
          # machine gets rather than whatever is newest that morning.
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bunx tsc --noEmit

  # Its own job, so the failure has a name. A pull request that adds a machine
  # name or a mesh address fails a check called "guard" instead of one line in
  # the middle of the full test output.
  guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test tests/no-personal-data.test.ts

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      # get.sh is the one install script that has to survive /bin/sh, so it is
      # read as dash; the rest declare bash and use arrays, [[ ]] and local.
      # --severity=warning is the gate: info-level style notes differ between
      # shellcheck releases, and a runner image bumping its package should not
      # turn a green pull request red on its own.
      - name: shellcheck install/*.sh
        run: |
          shellcheck --severity=warning -s dash install/get.sh
          for f in install/*.sh; do
            if [ "$f" != install/get.sh ]; then
              shellcheck --severity=warning -s bash "$f"
            fi
          done
