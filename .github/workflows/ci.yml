# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # The version install/quickstart.sh pins, so CI runs what a fresh
          # machine gets rather than whatever is newest that morning.
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bunx tsc --noEmit

  # Its own job, so the failure has a name. A pull request that adds a machine
  # name or a mesh address fails a check called "guard" instead of one line in
  # the middle of the full test output.
  guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test tests/no-personal-data.test.ts

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      # get.sh is the one install script that has to survive /bin/sh, so it is
      # read as dash; the rest declare bash and use arrays, [[ ]] and local.
      # --severity=warning is the gate: info-level style notes differ between
      # shellcheck releases, and a runner image bumping its package should not
      # turn a green pull request red on its own.
      - name: shellcheck install/*.sh
        run: |
          shellcheck --severity=warning -s dash install/get.sh
          for f in install/*.sh; do
            if [ "$f" != install/get.sh ]; then
              shellcheck --severity=warning -s bash "$f"
            fi
          done

  # The Windows installer scripts have no test runner and no lint pass, so this
  # is the cheapest check that says they are still PowerShell. It runs here, on
  # the Linux runners the rest of CI already uses, because pwsh is on the image
  # and a parse needs nothing from Windows.
  #
  # It is the weaker half of a pair. PowerShell 7 accepts syntax Windows
  # PowerShell 5.1 rejects, and 5.1 is all the smoke target has, so
  # installer-windows.yml parses the same files again under 5.1 on a Windows
  # runner. This job is what catches a broken script on a pull request that
  # touches nothing else the Windows workflow watches.
  pwsh-parse:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: parse install/windows/*.ps1
        shell: pwsh
        run: |
          Write-Host "pwsh: $($PSVersionTable.PSVersion)"
          $failed = @()
          foreach ($file in Get-ChildItem -Path install/windows -Filter *.ps1) {
            $errors = $null
            $tokens = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              $failed += $file.Name
              Write-Host "$($file.Name): $($errors.Count) parse error(s)"
              foreach ($e in $errors) {
                Write-Host "  line $($e.Extent.StartLineNumber): $($e.Message)"
              }
            } else {
              Write-Host "$($file.Name): parses"
            }
          }
          if ($failed.Count -gt 0) {
            Write-Host "does not parse: $($failed -join ', ')"
            exit 1
          }
