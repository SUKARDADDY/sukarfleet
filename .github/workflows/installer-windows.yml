# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Builds the Windows installer and then installs with it, twice, in both scopes.
#
# The build is the easy half. The half worth a runner is the smoke: the installer
# is PowerShell driven by an Inno Setup script, neither of which any test can
# reach, so the only honest check is to run it on a Windows machine and ask the
# machine what happened. Per-user must end with a scheduled task and a node
# answering on loopback. Machine-wide must end with a service running under its
# own account and a node that refuses an unauthenticated console call.
#
# The scripts are parsed twice before any of that, under Windows PowerShell 5.1
# and under PowerShell 7. The smoke target is a Windows 10 laptop that has 5.1
# and nothing else, and 5.1 rejects syntax 7 accepts. A parse under 7 alone would
# pass a script that cannot run where it has to run.
#
# The upload is an artifact, never a release asset, for the same reason as
# tray.yml: cutting a release is a deliberate act by a person, and it is the step
# that fills the SHA256 this job prints into install/easytier-pins.txt.
name: installer-windows

on:
  push:
    paths:
      - 'install/windows/**'
      - 'install/easytier-pins.txt'
      - 'src/**'
      - 'ui/**'
      - '.github/workflows/installer-windows.yml'
  pull_request:
    paths:
      - 'install/windows/**'
      - 'install/easytier-pins.txt'
      - 'src/**'
      - 'ui/**'
      - '.github/workflows/installer-windows.yml'
  workflow_dispatch:

# Two pushes to the same branch a minute apart would otherwise both take a runner and both install
# into the same machine-wide paths on their own copies of the image -- harmless, but the second
# result is the only one anybody reads and the first one costs 40 minutes of runner to produce.
# Keyed on the ref, so a push to one branch never cancels another branch's run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    # A hung installer is the failure this job exists to find; it must not cost
    # the six hours a job gets by default.
    timeout-minutes: 75
    # The secrets context is not available in a step's if, so the token is
    # lifted into the job environment and the sign step tests that instead.
    # No secret configured means an empty string, and the step is skipped.
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # Printed because an installer is only as reproducible as the toolchain
      # that built it, and because "which PowerShell" is the first question a
      # failed parse raises.
      - name: toolchain
        shell: pwsh
        run: |
          Write-Host "pwsh: $($PSVersionTable.PSVersion)"
          powershell -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe' }
          Write-Host "iscc: $iscc"
          if (-not (Test-Path -LiteralPath $iscc)) {
            Write-Host 'Inno Setup is not on this image. The runner image README says it is;'
            Write-Host 'if that changed, install it here before this step.'
            exit 1
          }

      # ParseFile rather than a lint pass: a parse error is the failure mode that
      # matters, and it is the one 5.1 and 7 disagree about.
      - name: parse the scripts under Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = @()
          foreach ($file in Get-ChildItem -Path install\windows -Filter *.ps1) {
            $errors = $null
            $tokens = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              $failed += $file.Name
              Write-Host "$($file.Name): $($errors.Count) parse error(s)"
              foreach ($e in $errors) {
                Write-Host "  line $($e.Extent.StartLineNumber): $($e.Message)"
              }
            } else {
              Write-Host "$($file.Name): parses"
            }
          }
          if ($failed.Count -gt 0) {
            Write-Host "does not parse under 5.1: $($failed -join ', ')"
            exit 1
          }

      - name: parse the scripts under PowerShell 7
        shell: pwsh
        run: |
          $failed = @()
          foreach ($file in Get-ChildItem -Path install\windows -Filter *.ps1) {
            $errors = $null
            $tokens = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              $failed += $file.Name
              Write-Host "$($file.Name): $($errors.Count) parse error(s)"
              foreach ($e in $errors) {
                Write-Host "  line $($e.Extent.StartLineNumber): $($e.Message)"
              }
            } else {
              Write-Host "$($file.Name): parses"
            }
          }
          if ($failed.Count -gt 0) {
            Write-Host "does not parse under 7: $($failed -join ', ')"
            exit 1
          }

      # /O overrides whatever OutputDir the script sets, so the path below is the
      # one this workflow depends on rather than one that can move underneath it.
      - name: build the installer
        shell: pwsh
        run: |
          $dist = Join-Path $PWD 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe' }
          & $iscc "/O$dist" install\windows\sukarfleet.iss
          if ($LASTEXITCODE -ne 0) {
            Write-Host "iscc exited $LASTEXITCODE"
            exit 1
          }
          $exe = Join-Path $dist 'sukarfleet-setup-windows-x86_64.exe'
          if (-not (Test-Path -LiteralPath $exe)) {
            Write-Host "iscc did not produce sukarfleet-setup-windows-x86_64.exe. What it did produce:"
            Get-ChildItem -Recurse $dist | ForEach-Object { Write-Host "  $($_.FullName)" }
            exit 1
          }
          Write-Host "built: $exe ($((Get-Item -LiteralPath $exe).Length) bytes)"

      - name: hash the installer
        shell: pwsh
        run: |
          $dist = Join-Path $PWD 'dist'
          $name = 'sukarfleet-setup-windows-x86_64.exe'
          $sha = (Get-FileHash -LiteralPath (Join-Path $dist $name) -Algorithm SHA256).Hash.ToLower()
          "$sha  $name" | Set-Content -Encoding ascii (Join-Path $dist 'SHA256SUMS')
          # Printed as the pin line install/easytier-pins.txt wants, so cutting a
          # release is a copy rather than a retyping. The version column is the
          # release tag without its leading v.
          Write-Host ''
          Write-Host 'pin line for install/easytier-pins.txt:'
          Write-Host "  <version>  x86_64  $sha  $name"

      - uses: actions/upload-artifact@v4
        id: artifact
        with:
          name: sukarfleet-setup-windows-x86_64
          path: |
            dist/sukarfleet-setup-windows-x86_64.exe
            dist/SHA256SUMS
          if-no-files-found: error

      # Per-user scope: what a person double-clicking the EXE gets, driven
      # silently. The mesh and the tray are skipped because neither is what this
      # step is asking about: the mesh needs a secret and a peer, and the tray
      # pin is unfilled until a release fills it. /NOOPEN keeps a browser from
      # being launched on a runner that has nobody at it.
      #
      # /MACHINE is passed even though a silent per-user install defaults it,
      # because a default that changes with the runner image is a smoke that
      # reports something different every month.
      - name: smoke - per-user silent install
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist\sukarfleet-setup-windows-x86_64.exe'
          $log = Join-Path $env:RUNNER_TEMP 'setup-currentuser.log'
          $scriptLogs = @((Join-Path $env:LOCALAPPDATA 'sukarfleet\install-user.log'))
          $p = Start-Process -FilePath $exe -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER',
            '/MACHINE=ci-runner', '/SKIPMESH', '/SKIPTRAY', '/NOOPEN',
            "/LOG=$log"
          )
          # Poll rather than wait: a silent install that never returns has to
          # be reported with its logs, not discovered when the job times out.
          $deadline = (Get-Date).AddMinutes(15)
          $lastReport = Get-Date
          while (-not $p.HasExited -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 10
            if (((Get-Date) - $lastReport).TotalSeconds -ge 60) {
              $lastReport = Get-Date
              Write-Host "still installing at $((Get-Date).ToString('HH:mm:ss'))"
              foreach ($sl in $scriptLogs) {
                if (Test-Path -LiteralPath $sl) {
                  Write-Host "  last lines of ${sl}:"
                  Get-Content -LiteralPath $sl -Tail 5 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "    $_" }
                }
              }
              Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'powershell|cmd|bun|ssh-keygen' } |
                ForEach-Object { Write-Host "  pid $($_.ProcessId): $($_.CommandLine)" }
            }
          }
          if (-not $p.HasExited) {
            Write-Host 'the installer did not return within 15 minutes; killing it'
            Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'powershell|cmd|bun|ssh-keygen' } |
              ForEach-Object { Write-Host "  pid $($_.ProcessId): $($_.CommandLine)" }
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            $hung = $true
          } else {
            $hung = $false
          }
          $p.WaitForExit()
          Write-Host "installer exit code: $($p.ExitCode)"
          if (Test-Path -LiteralPath $log) {
            Write-Host "--- $log ---"
            Get-Content -LiteralPath $log | ForEach-Object { Write-Host "  $_" }
            Write-Host '--- end of setup log ---'
          } else {
            Write-Host "no setup log at $log"
          }
          foreach ($sl in $scriptLogs) {
            if (Test-Path -LiteralPath $sl) {
              Write-Host "--- $sl ---"
              Get-Content -LiteralPath $sl | ForEach-Object { Write-Host "  $_" }
              Write-Host "--- end of $sl ---"
            } else {
              Write-Host "no script log at $sl"
            }
          }
          if ($hung -or $p.ExitCode -ne 0) { exit 1 }

      - name: smoke - the per-user node answers
        shell: pwsh
        run: |
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing -SkipHttpErrorCheck -TimeoutSec 3 `
                   -Uri 'http://127.0.0.1:7710/health'
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
            Start-Sleep -Seconds 1
          }
          if (-not $ok) {
            Write-Host 'no 200 from http://127.0.0.1:7710/health within 60 seconds'
            Get-ScheduledTask -TaskName sukarfleet -ErrorAction SilentlyContinue |
              Format-List TaskName, State | Out-String | Write-Host
            exit 1
          }
          Write-Host 'health: 200'
          $task = Get-ScheduledTask -TaskName sukarfleet -ErrorAction SilentlyContinue
          if (-not $task) {
            Write-Host 'the node answered but scheduled task sukarfleet is not registered:'
            Write-Host 'the per-user install left nothing that survives a sign-out'
            exit 1
          }
          Write-Host "scheduled task sukarfleet: $($task.State)"

      # The machine-wide smoke below asserts a node on the same port, so a
      # per-user node left running would make it a false green. The uninstall is
      # therefore checked, not just run.
      - name: smoke - uninstall the per-user install
        shell: pwsh
        run: |
          $roots = @(
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall',
            'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall',
            'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
          )
          $entry = $null
          foreach ($root in $roots) {
            if (-not (Test-Path -LiteralPath $root)) { continue }
            foreach ($key in Get-ChildItem -LiteralPath $root) {
              $props = Get-ItemProperty -LiteralPath $key.PSPath
              if ($props.DisplayName -and $props.DisplayName -match 'sukarfleet') {
                $entry = $props
                Write-Host "uninstall entry: $($key.PSPath)"
                break
              }
            }
            if ($entry) { break }
          }
          if (-not $entry) {
            Write-Host 'the install registered no uninstaller: there is no supported way to remove it'
            exit 1
          }
          # Inno records the scope it was installed in as a switch on the
          # uninstall string, and dropping it sends the uninstaller looking in
          # the wrong registry hive. Keep whatever is there and add ours.
          $command = $entry.UninstallString
          if ($command -match '^"([^"]+)"\s*(.*)$') {
            $uninstaller = $Matches[1]
            $rest = $Matches[2]
          } else {
            $uninstaller = $command
            $rest = ''
          }
          $argv = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART')
          if ($rest) { $argv += ($rest -split '\s+' | Where-Object { $_ }) }
          Write-Host "running: $uninstaller $($argv -join ' ')"
          Start-Process -FilePath $uninstaller -Wait -ArgumentList $argv
          # Inno's uninstaller re-launches itself from a temp copy and the first
          # process returns straight away, so the wait above proves nothing. Poll
          # the port instead, which is the thing the next step needs free.
          $stopped = $false
          for ($i = 0; $i -lt 60; $i++) {
            $r = $null
            try {
              $r = Invoke-WebRequest -UseBasicParsing -SkipHttpErrorCheck -TimeoutSec 2 `
                   -Uri 'http://127.0.0.1:7710/health'
            } catch { $stopped = $true; break }
            if (-not $r) { $stopped = $true; break }
            Start-Sleep -Seconds 1
          }
          if (-not $stopped) {
            Write-Host 'the per-user node still answers on 7710 after uninstall:'
            Write-Host 'the machine-wide smoke below would be reading the wrong node'
            exit 1
          }
          if (Get-ScheduledTask -TaskName sukarfleet -ErrorAction SilentlyContinue) {
            Write-Host 'scheduled task sukarfleet survived the uninstall'
            exit 1
          }
          Write-Host 'per-user install removed: port free, task gone'

      # Machine-wide scope. The runner account is already an administrator, so
      # /ALLUSERS needs no elevation prompt here; on a real machine it is one UAC
      # click.
      - name: smoke - machine-wide silent install
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist\sukarfleet-setup-windows-x86_64.exe'
          $log = Join-Path $env:RUNNER_TEMP 'setup-allusers.log'
          $scriptLogs = @((Join-Path $env:ProgramData 'sukarfleet\install-machine.log'), (Join-Path $env:ProgramData 'sukarfleet\node\logs\install.log'))
          $p = Start-Process -FilePath $exe -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/ALLUSERS',
            '/MACHINE=ci-runner', '/SKIPMESH', '/SKIPTRAY', '/NOOPEN',
            "/LOG=$log"
          )
          # Poll rather than wait: a silent install that never returns has to
          # be reported with its logs, not discovered when the job times out.
          $deadline = (Get-Date).AddMinutes(15)
          $lastReport = Get-Date
          while (-not $p.HasExited -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 10
            if (((Get-Date) - $lastReport).TotalSeconds -ge 60) {
              $lastReport = Get-Date
              Write-Host "still installing at $((Get-Date).ToString('HH:mm:ss'))"
              foreach ($sl in $scriptLogs) {
                if (Test-Path -LiteralPath $sl) {
                  Write-Host "  last lines of ${sl}:"
                  Get-Content -LiteralPath $sl -Tail 5 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "    $_" }
                }
              }
              Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'powershell|cmd|bun|ssh-keygen' } |
                ForEach-Object { Write-Host "  pid $($_.ProcessId): $($_.CommandLine)" }
            }
          }
          if (-not $p.HasExited) {
            Write-Host 'the installer did not return within 15 minutes; killing it'
            Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'powershell|cmd|bun|ssh-keygen' } |
              ForEach-Object { Write-Host "  pid $($_.ProcessId): $($_.CommandLine)" }
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            $hung = $true
          } else {
            $hung = $false
          }
          $p.WaitForExit()
          Write-Host "installer exit code: $($p.ExitCode)"
          if (Test-Path -LiteralPath $log) {
            Write-Host "--- $log ---"
            Get-Content -LiteralPath $log | ForEach-Object { Write-Host "  $_" }
            Write-Host '--- end of setup log ---'
          } else {
            Write-Host "no setup log at $log"
          }
          foreach ($sl in $scriptLogs) {
            if (Test-Path -LiteralPath $sl) {
              Write-Host "--- $sl ---"
              Get-Content -LiteralPath $sl | ForEach-Object { Write-Host "  $_" }
              Write-Host "--- end of $sl ---"
            } else {
              Write-Host "no script log at $sl"
            }
          }
          if ($hung -or $p.ExitCode -ne 0) { exit 1 }

      - name: smoke - the service runs, under its own account
        shell: pwsh
        run: |
          $svc = $null
          for ($i = 0; $i -lt 60; $i++) {
            $svc = Get-Service -Name sukarfleet-node -ErrorAction SilentlyContinue
            if ($svc -and $svc.Status -eq 'Running') { break }
            Start-Sleep -Seconds 1
          }
          if (-not $svc) {
            Write-Host 'service sukarfleet-node was never registered'
            exit 1
          }
          if ($svc.Status -ne 'Running') {
            Write-Host "service sukarfleet-node is $($svc.Status) after 60 seconds"
            # The service controller says why a service would not start, and it says
            # it in the System event log, not to the process that asked. Logon
            # failure, a wrapper that died before its first line, a timeout: each
            # is a different fix, and the wrapper log cannot tell them apart.
            Write-Host '--- Service Control Manager events (last 15 minutes) ---'
            Get-WinEvent -FilterHashtable @{ LogName = 'System'; ProviderName = 'Service Control Manager'; StartTime = (Get-Date).AddMinutes(-15) } -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -match 'sukarfleet' } |
              ForEach-Object { Write-Host "  $($_.TimeCreated) id=$($_.Id) $($_.Message -replace '\s+', ' ')" }
            Write-Host '--- Application log errors (last 15 minutes) ---'
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Level = 1, 2; StartTime = (Get-Date).AddMinutes(-15) } -ErrorAction SilentlyContinue |
              Select-Object -First 12 |
              ForEach-Object { Write-Host "  $($_.TimeCreated) $($_.ProviderName): $(($_.Message -replace '\s+', ' ').Substring(0, [Math]::Min(400, ($_.Message -replace '\s+', ' ').Length)))" }
            Write-Host '--- sc qc / showsid ---'
            sc.exe qc sukarfleet-node
            sc.exe showsid sukarfleet-node
            Write-Host '--- ACLs ---'
            icacls.exe 'C:\ProgramData\sukarfleet\node'
            icacls.exe 'C:\Program Files\sukarfleet'
            icacls.exe 'C:\Program Files\sukarfleet\sukarfleet-node.xml'
            $logs = 'C:\ProgramData\sukarfleet\node\logs'
            if (Test-Path -LiteralPath $logs) {
              Get-ChildItem -LiteralPath $logs | ForEach-Object {
                Write-Host "--- $($_.FullName) ---"
                Get-Content -LiteralPath $_.FullName -Tail 80 | ForEach-Object { Write-Host "  $_" }
              }
            }
            exit 1
          }
          Write-Host 'service sukarfleet-node: Running'
          # The account is the point of the machine-wide scope: a node running as
          # SYSTEM would be a different security decision than the one documented.
          sc.exe qc sukarfleet-node

      - name: smoke - the console token gates the machine-wide node
        shell: pwsh
        run: |
          $state = 'http://127.0.0.1:7710/api/ui/state'
          $r = $null
          for ($i = 0; $i -lt 60; $i++) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing -SkipHttpErrorCheck -TimeoutSec 3 -Uri $state
              break
            } catch { }
            Start-Sleep -Seconds 1
          }
          if (-not $r) {
            Write-Host "no answer at all from $state within 60 seconds"
            exit 1
          }
          Write-Host "without a header: $($r.StatusCode)"
          Write-Host "  body: $($r.Content)"
          if ($r.StatusCode -ne 401) {
            Write-Host 'a machine-wide node answered an unauthenticated console call:'
            Write-Host 'every local account can drive it, which is the hole the token closes'
            exit 1
          }
          $body = $r.Content | ConvertFrom-Json
          if ($body.error -ne 'console-token-required') {
            Write-Host "401 body error is '$($body.error)', expected 'console-token-required'"
            Write-Host 'the console and the tray both branch on that exact string'
            exit 1
          }
          $tokenFile = 'C:\ProgramData\sukarfleet\node\console-token'
          if (-not (Test-Path -LiteralPath $tokenFile)) {
            Write-Host "the node is gated and there is no token file at $tokenFile"
            exit 1
          }
          $token = (Get-Content -Raw -LiteralPath $tokenFile).Trim()
          Write-Host "token file: $tokenFile ($($token.Length) characters)"
          # The first authenticated call builds the whole console state, and on a
          # fresh node that includes probes with their own network timeouts; one
          # five-second attempt timed out on a runner while the same call answered
          # in a moment on a real machine. Wait longer, and try more than once.
          $ok = $null
          for ($attempt = 1; $attempt -le 6; $attempt++) {
            try {
              $ok = Invoke-WebRequest -UseBasicParsing -SkipHttpErrorCheck -TimeoutSec 30 -Uri $state `
                    -Headers @{ Authorization = "Bearer $token" }
              break
            } catch {
              Write-Host "attempt ${attempt}: $($_.Exception.Message)"
              Start-Sleep -Seconds 5
            }
          }
          if (-not $ok) {
            Write-Host 'the authenticated state call never answered'
            exit 1
          }
          Write-Host "with the header: $($ok.StatusCode)"
          if ($ok.StatusCode -ne 200) {
            Write-Host "  body: $($ok.Content)"
            Write-Host 'the token in the file the installer wrote does not open the console'
            exit 1
          }
          icacls.exe $tokenFile

      - name: smoke - uninstall the machine-wide install
        shell: pwsh
        run: |
          $roots = @(
            'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall',
            'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall',
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall'
          )
          $entry = $null
          foreach ($root in $roots) {
            if (-not (Test-Path -LiteralPath $root)) { continue }
            foreach ($key in Get-ChildItem -LiteralPath $root) {
              $props = Get-ItemProperty -LiteralPath $key.PSPath
              if ($props.DisplayName -and $props.DisplayName -match 'sukarfleet') {
                $entry = $props
                Write-Host "uninstall entry: $($key.PSPath)"
                break
              }
            }
            if ($entry) { break }
          }
          if (-not $entry) {
            Write-Host 'the machine-wide install registered no uninstaller'
            exit 1
          }
          # Inno records the scope it was installed in as a switch on the
          # uninstall string, and dropping it sends the uninstaller looking in
          # the wrong registry hive. Keep whatever is there and add ours.
          $command = $entry.UninstallString
          if ($command -match '^"([^"]+)"\s*(.*)$') {
            $uninstaller = $Matches[1]
            $rest = $Matches[2]
          } else {
            $uninstaller = $command
            $rest = ''
          }
          $argv = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART')
          if ($rest) { $argv += ($rest -split '\s+' | Where-Object { $_ }) }
          Write-Host "running: $uninstaller $($argv -join ' ')"
          $u = Start-Process -FilePath $uninstaller -PassThru -ArgumentList $argv
          $u.WaitForExit()
          Write-Host "uninstaller exit code: $($u.ExitCode)"
          if ($u.ExitCode -ne 0) {
            Write-Host 'the machine-wide uninstaller exited non-zero'
            exit 1
          }
          # Inno's uninstaller copies itself into TEMP and re-launches, so the
          # process started above returns long before the work is done -- the
          # same reason the per-user step polls rather than trusting the wait.
          # Wait for every uninstaller process to be gone before asking what
          # happened, or the answers below are read mid-uninstall.
          # The first process exits before its TEMP copy has even started, so one
          # empty poll proves nothing: the quiet has to last. Five consecutive
          # empty polls, two seconds apart, is the bar.
          $settled = $false
          $quiet = 0
          for ($i = 0; $i -lt 150; $i++) {
            $running = @(Get-Process -ErrorAction SilentlyContinue |
              Where-Object { $_.ProcessName -like 'unins*' -or $_.ProcessName -like '_iu*' })
            if ($running.Count -eq 0) { $quiet++ } else { $quiet = 0 }
            if ($quiet -ge 5) { $settled = $true; break }
            Start-Sleep -Seconds 2
          }
          if (-not $settled) {
            Write-Host 'an uninstaller process was still running after 5 minutes:'
            Get-Process | Where-Object { $_.ProcessName -like 'unins*' -or $_.ProcessName -like '_iu*' } |
              ForEach-Object { Write-Host "  pid $($_.Id): $($_.ProcessName)" }
            exit 1
          }
          $gone = $false
          for ($i = 0; $i -lt 60; $i++) {
            if (-not (Get-Service -Name sukarfleet-node -ErrorAction SilentlyContinue)) {
              $gone = $true
              break
            }
            Start-Sleep -Seconds 1
          }
          if (-not $gone) {
            Write-Host 'service sukarfleet-node survived the uninstall'
            exit 1
          }
          # {app} is Inno's to remove, and it is a subdirectory of the tree the
          # uninstall script cleans up in. A script that deleted that tree would
          # take unins000.exe with it while it was running, and the directory
          # left here is how that shows up.
          # Inno deletes its own unins000.exe last, from the TEMP copy, and when
          # it cannot it schedules the delete for the next boot; a directory
          # holding nothing but that stub is a finished uninstall. Anything else
          # left is not. Give the last delete a minute before deciding.
          # ProgramW6432 is where 64-bit Program Files actually is on this machine, which is
          # not always C:\Program Files: {commonpf64} in the .iss follows the same variable.
          $appDir = (Join-Path $env:ProgramW6432 'sukarfleet\app')
          for ($i = 0; $i -lt 30; $i++) {
            if (-not (Test-Path -LiteralPath $appDir)) { break }
            $left = @(Get-ChildItem -LiteralPath $appDir -Force | Where-Object { $_.Name -notlike 'unins000.*' })
            if ($left.Count -eq 0) { break }
            Start-Sleep -Seconds 2
          }
          if (Test-Path -LiteralPath $appDir) {
            $left = @(Get-ChildItem -LiteralPath $appDir -Force | Where-Object { $_.Name -notlike 'unins000.*' })
            if ($left.Count -gt 0) {
              Write-Host "$appDir survived the uninstall; what is in it:"
              Get-ChildItem -LiteralPath $appDir -Force | ForEach-Object { Write-Host "  $($_.Name)" }
              exit 1
            }
            Write-Host "$appDir holds only the uninstaller stub, which Windows removes at the next boot"
          }
          $stillListed = $null
          foreach ($root in $roots) {
            if (-not (Test-Path -LiteralPath $root)) { continue }
            foreach ($key in Get-ChildItem -LiteralPath $root) {
              $props = Get-ItemProperty -LiteralPath $key.PSPath
              if ($props.DisplayName -and $props.DisplayName -match 'sukarfleet') {
                $stillListed = $key.PSPath
                break
              }
            }
            if ($stillListed) { break }
          }
          if ($stillListed) {
            Write-Host "an uninstall entry survived the uninstall: $stillListed"
            Write-Host 'Apps and features would offer to remove software that is not there'
            exit 1
          }
          # Uninstall removes the software and keeps the data, which is the
          # documented contract. This one is meant to still be here.
          foreach ($kept in @('C:\ProgramData\sukarfleet\node')) {
            Write-Host "kept after uninstall: $kept -> $(Test-Path -LiteralPath $kept)"
          }
          Write-Host 'machine-wide install removed: service gone, {app} gone, uninstall entry gone'

      # The refusal, which is the half of an installer nobody tests until it is
      # wrong. A machine-wide install with no mesh address and no /SKIPMESH is a
      # refusal Install-MachineNode.ps1 takes before it touches anything, and
      # Setup ignores the exit code of a [Run] program -- so for as long as the
      # scripts were launched from [Run], this exact command line installed
      # nothing, said nothing, and exited 0. Launching them from a BeforeInstall
      # hook bought the box and the log line but not the number: the runner
      # showed the exception in the log and Setup exiting 0 all the same.
      #
      # So the refusal is taken in PrepareToInstall now, before the first file is
      # copied, and what is asserted here is the number, the sentence and the
      # absence: exit code 7, the reason in Setup's own log, and a machine with
      # no service, no {app}, no uninstall entry and no node directory.
      #
      # /MACHINE is passed for the same reason as the two steps above: a default
      # that follows the runner image makes a smoke that reports something
      # different every month.
      - name: smoke - a refused machine-wide install exits 7 and installs nothing
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist\sukarfleet-setup-windows-x86_64.exe'
          $log = Join-Path $env:RUNNER_TEMP 'setup-refused.log'
          $scriptLog = Join-Path $env:ProgramData 'sukarfleet\install-machine.log'
          $nodeDir = Join-Path $env:ProgramData 'sukarfleet\node'
          # ProgramW6432 is where 64-bit Program Files actually is on this machine, which is
          # not always C:\Program Files: {commonpf64} in the .iss follows the same variable.
          $appDir = (Join-Path $env:ProgramW6432 'sukarfleet\app')

          # The steps above installed and uninstalled a machine-wide node, and a
          # machine-wide uninstall KEEPS the node directory on purpose. Both of
          # the absences asserted below are therefore about this run only, so the
          # leftovers come off first. The uninstaller stub Windows was going to
          # delete at the next boot is the other one.
          Remove-Item -LiteralPath $scriptLog -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $nodeDir -Recurse -Force -ErrorAction SilentlyContinue
          for ($i = 0; $i -lt 15; $i++) {
            if (-not (Test-Path -LiteralPath $appDir)) { break }
            Remove-Item -LiteralPath $appDir -Recurse -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
          }
          foreach ($stale in @($nodeDir, $appDir)) {
            if (Test-Path -LiteralPath $stale) {
              Write-Host "$stale could not be cleared before the refused install:"
              Get-ChildItem -LiteralPath $stale -Force | ForEach-Object { Write-Host "  $($_.Name)" }
              Write-Host 'this step cannot tell what the refused install created from what was already there'
              exit 1
            }
          }

          $p = Start-Process -FilePath $exe -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/ALLUSERS',
            '/MACHINE=ci-runner', '/SKIPTRAY', '/NOOPEN',
            "/LOG=$log"
          )
          # Same poll as the installs above: a refusal that hangs is still a bug,
          # and it has to be reported rather than run into the job timeout.
          $deadline = (Get-Date).AddMinutes(10)
          while (-not $p.HasExited -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 5
          }
          if (-not $p.HasExited) {
            Write-Host 'the refused install did not return within 10 minutes; killing it'
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            $p.WaitForExit()
            exit 1
          }
          $p.WaitForExit()
          Write-Host "installer exit code: $($p.ExitCode)"
          $setupLog = ''
          if (Test-Path -LiteralPath $log) {
            $setupLog = Get-Content -Raw -LiteralPath $log
            Write-Host "--- $log ---"
            Get-Content -LiteralPath $log | ForEach-Object { Write-Host "  $_" }
            Write-Host '--- end of setup log ---'
          } else {
            Write-Host "no setup log at $log"
          }
          if (Test-Path -LiteralPath $scriptLog) {
            Write-Host "--- $scriptLog ---"
            Get-Content -LiteralPath $scriptLog | ForEach-Object { Write-Host "  $_" }
            Write-Host "--- end of $scriptLog ---"
          }

          $failures = @()
          # 7 is "The Preparing to Install stage determined that Setup cannot
          # proceed" (Inno help, "Setup Exit Codes"), which is the only exit code
          # that means the install was refused rather than merely unhappy.
          if ($p.ExitCode -ne 7) {
            $failures += "Setup exited $($p.ExitCode) for an install its own preflight refused; 7 is the refusal"
          }
          if ($setupLog -notmatch 'This machine-wide install would be refused:') {
            $failures += "the preflight's refusal is not in $log"
          }
          if ($setupLog -notmatch 'no -MeshIp') {
            $failures += "the reason the preflight gave is not in $log"
          }
          if (Get-Service -Name sukarfleet-node -ErrorAction SilentlyContinue) {
            $failures += 'a refused install registered the sukarfleet-node service'
          }
          # The preflight reads; it does not create. A node directory here means
          # it wrote one, which is the whole thing this step exists to catch.
          if (Test-Path -LiteralPath $nodeDir) {
            $failures += "a refused install created $nodeDir"
            Get-ChildItem -LiteralPath $nodeDir -Force -Recurse -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "  $($_.FullName)" }
          }
          if (Test-Path -LiteralPath $appDir) {
            $failures += "a refused install created $appDir"
            Get-ChildItem -LiteralPath $appDir -Force | ForEach-Object { Write-Host "  $($_.Name)" }
          }
          # No cleanup uninstall here, and that is the assertion: a refusal taken
          # before the Preparing to Install stage finishes leaves nothing to
          # uninstall. An entry in Apps and features would mean Setup got past
          # the refusal and copied files.
          $roots = @(
            'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall',
            'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall',
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall'
          )
          foreach ($root in $roots) {
            if (-not (Test-Path -LiteralPath $root)) { continue }
            foreach ($key in Get-ChildItem -LiteralPath $root) {
              $props = Get-ItemProperty -LiteralPath $key.PSPath
              if ($props.DisplayName -and $props.DisplayName -match 'sukarfleet') {
                $failures += "a refused install left an uninstall entry: $($key.PSPath)"
              }
            }
          }
          if ($failures.Count -gt 0) {
            foreach ($f in $failures) { Write-Host $f }
            exit 1
          }
          Write-Host 'a refused machine-wide install exits 7, says why in the setup log, and installs nothing'

      # Adoption, which is the one path in this installer that acts on a machine that already
      # has a node rather than on an empty one, and the one nothing else in this workflow runs:
      # Get-AdoptionPlan is called twice on a real adoption, once by the preflight before a file
      # is copied and once again immediately before the old node is stopped, and until this step
      # neither call had ever run outside a developer's machine.
      #
      # What is asserted is the whole of the promise: the preflight passes with a per-user node
      # present rather than refusing it, the service comes up, the scheduled task that used to
      # start that node is gone, and the machine-wide node carries the identity of the node it
      # adopted rather than a fresh one every peer would have to pair with again.
      #
      # The step installs both scopes and removes both at the end, because the steps after it
      # are entitled to the machine the steps before it had.
      - name: smoke - a machine-wide install adopts a per-user node
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist\sukarfleet-setup-windows-x86_64.exe'
          $userLog = Join-Path $env:RUNNER_TEMP 'setup-adopt-user.log'
          $machineLog = Join-Path $env:RUNNER_TEMP 'setup-adopt-machine.log'
          $userScriptLogs = @((Join-Path $env:LOCALAPPDATA 'sukarfleet\install-user.log'))
          $machineScriptLogs = @((Join-Path $env:ProgramData 'sukarfleet\install-machine.log'), (Join-Path $env:ProgramData 'sukarfleet\node\logs\install.log'))
          $userConfigDir = Join-Path $env:USERPROFILE '.config\sukarfleet'
          $nodeDir = Join-Path $env:ProgramData 'sukarfleet\node'

          # The same poll, kill and log dump the two install steps above use, in one function
          # because this step runs two installs. A silent install that never returns has to be
          # reported with its logs, not discovered when the job times out.
          function Invoke-SilentSetup {
            param(
              [Parameter(Mandatory)] [string] $Exe,
              [Parameter(Mandatory)] [string[]] $Argv,
              [Parameter(Mandatory)] [string] $SetupLog,
              [Parameter(Mandatory)] [AllowEmptyCollection()] [string[]] $ScriptLogs,
              [int] $Minutes = 15
            )
            $p = Start-Process -FilePath $Exe -PassThru -ArgumentList $Argv
            $deadline = (Get-Date).AddMinutes($Minutes)
            $lastReport = Get-Date
            while (-not $p.HasExited -and (Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 10
              if (((Get-Date) - $lastReport).TotalSeconds -ge 60) {
                $lastReport = Get-Date
                Write-Host "still installing at $((Get-Date).ToString('HH:mm:ss'))"
                foreach ($sl in $ScriptLogs) {
                  if (Test-Path -LiteralPath $sl) {
                    Write-Host "  last lines of ${sl}:"
                    Get-Content -LiteralPath $sl -Tail 5 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "    $_" }
                  }
                }
                Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'powershell|cmd|bun|ssh-keygen' } |
                  ForEach-Object { Write-Host "  pid $($_.ProcessId): $($_.CommandLine)" }
              }
            }
            $hung = $false
            if (-not $p.HasExited) {
              Write-Host "the installer did not return within $Minutes minutes; killing it"
              Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'powershell|cmd|bun|ssh-keygen' } |
                ForEach-Object { Write-Host "  pid $($_.ProcessId): $($_.CommandLine)" }
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              $hung = $true
            }
            $p.WaitForExit()
            Write-Host "installer exit code: $($p.ExitCode)"
            $text = ''
            if (Test-Path -LiteralPath $SetupLog) {
              $text = Get-Content -Raw -LiteralPath $SetupLog
              Write-Host "--- $SetupLog ---"
              Get-Content -LiteralPath $SetupLog | ForEach-Object { Write-Host "  $_" }
              Write-Host '--- end of setup log ---'
            } else {
              Write-Host "no setup log at $SetupLog"
            }
            foreach ($sl in $ScriptLogs) {
              if (Test-Path -LiteralPath $sl) {
                Write-Host "--- $sl ---"
                Get-Content -LiteralPath $sl | ForEach-Object { Write-Host "  $_" }
                Write-Host "--- end of $sl ---"
              } else {
                Write-Host "no script log at $sl"
              }
            }
            return [pscustomobject]@{ ExitCode = $p.ExitCode; Hung = $hung; SetupLog = $text }
          }

          # machine-key.json is the fleet identity and it holds a private key as well as a public
          # one, so what is printed and compared is a hash of the public half and never the file.
          function Get-MachineKeyHash {
            param([Parameter(Mandatory)] [string] $Path)
            if (-not (Test-Path -LiteralPath $Path)) { return '<missing>' }
            try {
              $key = Get-Content -Raw -LiteralPath $Path | ConvertFrom-Json
              $pub = ConvertTo-Json $key.publicKeyJwk -Depth 8 -Compress
              $bytes = [Security.Cryptography.SHA256]::Create().ComputeHash([Text.Encoding]::UTF8.GetBytes($pub))
              return (($bytes | ForEach-Object { $_.ToString('x2') }) -join '')
            } catch {
              return "<unreadable: $($_.Exception.Message)>"
            }
          }

          # --- the node that will be adopted ---------------------------------------
          # Same argument list as the per-user step at the top of this job, so what is adopted
          # here is the install that job already proved.
          $u = Invoke-SilentSetup -Exe $exe -SetupLog $userLog -ScriptLogs $userScriptLogs -Argv @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER',
            '/MACHINE=ci-runner', '/SKIPMESH', '/SKIPTRAY', '/NOOPEN',
            "/LOG=$userLog"
          )
          if ($u.Hung -or $u.ExitCode -ne 0) {
            Write-Host 'the per-user install this step adopts did not finish; there is nothing to adopt'
            exit 1
          }

          # The node writes machine-key.json before it opens its port, so a 200 from /health is
          # also the proof that the identity this step is about to record exists on disk.
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing -SkipHttpErrorCheck -TimeoutSec 3 `
                   -Uri 'http://127.0.0.1:7710/health'
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
            Start-Sleep -Seconds 1
          }
          if (-not $ok) {
            Write-Host 'no 200 from http://127.0.0.1:7710/health within 60 seconds'
            Get-ScheduledTask -TaskName sukarfleet -ErrorAction SilentlyContinue |
              Format-List TaskName, State | Out-String | Write-Host
            Write-Host 'the per-user node never came up, so an adoption here would prove nothing'
            exit 1
          }
          Write-Host 'per-user health: 200'

          # --- what makes it that node ---------------------------------------------
          # Two things travel, and Install-MachineNode.ps1 copies both into the node directory:
          # machine-key.json, which is what peers pinned, and the fleet SSH key the installer
          # generated. The machine name is read too, because the adopted config is rewritten on
          # the way across and a rewrite that changed it would be a different machine.
          $userKeyHash = Get-MachineKeyHash -Path (Join-Path $userConfigDir 'machine-key.json')
          $userSshPubFile = Join-Path $env:USERPROFILE '.ssh\id_sukarfleet_ed25519.pub'
          $userSshPub = '<missing>'
          if (Test-Path -LiteralPath $userSshPubFile) { $userSshPub = (Get-Content -Raw -LiteralPath $userSshPubFile).Trim() }
          $userMachine = '<missing>'
          $userConfigFile = Join-Path $userConfigDir 'config.json'
          if (Test-Path -LiteralPath $userConfigFile) {
            $userMachine = [string] ((Get-Content -Raw -LiteralPath $userConfigFile | ConvertFrom-Json).machine)
          }
          Write-Host "per-user config:      $userConfigFile (machine=$userMachine)"
          Write-Host "per-user machine key: $userKeyHash"
          Write-Host "per-user ssh key:     $userSshPub"
          foreach ($v in @($userKeyHash, $userSshPub, $userMachine)) {
            if ($v -like '<*') {
              Write-Host 'the per-user node has no identity to compare against, so this step cannot tell an adoption from a fresh install'
              exit 1
            }
          }

          # --- the adopting install ------------------------------------------------
          $m = Invoke-SilentSetup -Exe $exe -SetupLog $machineLog -ScriptLogs $machineScriptLogs -Argv @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/ALLUSERS',
            '/MACHINE=ci-runner', '/SKIPMESH', '/SKIPTRAY', '/NOOPEN', '/ADOPT=1',
            "/LOG=$machineLog"
          )

          # Every assertion from here on is collected rather than exited on: the cleanup at the
          # bottom has to run whatever they decide, or a failure here leaves a service and two
          # installs standing for every step after it. The exit is the last thing in the step.
          $failures = @()
          # The preflight is what "exit 0" proves. It ran Get-AdoptionPlan with the per-user task
          # registered, and a refusal there would have been exit 7 with nothing installed. The
          # script prints "preflight ok" to the preflight log, which lives in {tmp} and goes when
          # Setup goes, so the setup log is asked for the absence of the refusal instead.
          if ($m.Hung) { $failures += 'the adopting machine-wide install never returned' }
          if ($m.ExitCode -ne 0) {
            $failures += "the adopting install exited $($m.ExitCode); 0 is a preflight that accepted an adoption, 7 is one that refused it"
          }
          if ($m.SetupLog -match 'This machine-wide install would be refused:') {
            $failures += "the preflight refused the adoption it was asked for; the reason is in $machineLog"
          }

          # Same budget as the "service runs" step above: 60 one-second polls.
          $svc = $null
          for ($i = 0; $i -lt 60; $i++) {
            $svc = Get-Service -Name sukarfleet-node -ErrorAction SilentlyContinue
            if ($svc -and $svc.Status -eq 'Running') { break }
            Start-Sleep -Seconds 1
          }
          if (-not $svc) {
            $failures += 'the adopting install registered no sukarfleet-node service'
          } elseif ($svc.Status -ne 'Running') {
            $failures += "service sukarfleet-node is $($svc.Status) after 60 seconds"
          } else {
            Write-Host 'service sukarfleet-node: Running'
          }

          # One identity per PC is the whole reason adoption exists. A surviving task would mean
          # this machine now starts two nodes that fight over the same repos.
          $task = Get-ScheduledTask -TaskName sukarfleet -ErrorAction SilentlyContinue
          if ($task) {
            $failures += "the per-user scheduled task sukarfleet is still registered ($($task.State)): the machine would run two nodes"
          } else {
            Write-Host 'scheduled task sukarfleet: gone, which is what adoption unregisters'
          }

          $machineKeyHash = Get-MachineKeyHash -Path (Join-Path $nodeDir 'machine-key.json')
          $machineSshPubFile = Join-Path $nodeDir 'id_sukarfleet_ed25519.pub'
          $machineSshPub = '<missing>'
          if (Test-Path -LiteralPath $machineSshPubFile) { $machineSshPub = (Get-Content -Raw -LiteralPath $machineSshPubFile).Trim() }
          $machineConfigFile = Join-Path $nodeDir 'config.json'
          $machineMachine = '<missing>'
          if (Test-Path -LiteralPath $machineConfigFile) {
            $machineMachine = [string] ((Get-Content -Raw -LiteralPath $machineConfigFile | ConvertFrom-Json).machine)
          }
          Write-Host "machine-wide config:      $machineConfigFile (machine=$machineMachine)"
          Write-Host "machine-wide machine key: $machineKeyHash"
          Write-Host "machine-wide ssh key:     $machineSshPub"
          if ($machineKeyHash -ne $userKeyHash) {
            $failures += "machine-key.json did not travel: the adopted node holds $machineKeyHash, the per-user node held $userKeyHash, and every peer would have to pair with this machine again"
          }
          if ($machineSshPub -ne $userSshPub) {
            $failures += 'the fleet SSH key did not travel: the adopted node holds a different one than the node it adopted'
          }
          if ($machineMachine -ne $userMachine) {
            $failures += "the adopted config says machine=$machineMachine and the per-user config said machine=$userMachine"
          }

          # --- cleanup -------------------------------------------------------------
          # Both scopes are installed at this point: adoption takes the per-user node's identity
          # and unregisters its task, and leaves the per-user Setup entry alone. HKLM first, so
          # the service lets go of its files before the per-user copy goes.
          $roots = @(
            'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall',
            'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall',
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall'
          )
          $entries = @()
          foreach ($root in $roots) {
            if (-not (Test-Path -LiteralPath $root)) { continue }
            foreach ($key in Get-ChildItem -LiteralPath $root) {
              $props = Get-ItemProperty -LiteralPath $key.PSPath
              if ($props.DisplayName -and $props.DisplayName -match 'sukarfleet') {
                Write-Host "uninstall entry: $($key.PSPath)"
                $entries += $props
              }
            }
          }
          if ($entries.Count -eq 0) {
            $failures += 'neither install registered an uninstaller, so there was no supported way to clean up'
          }
          foreach ($entry in $entries) {
            # Inno records the scope it was installed in as a switch on the uninstall string, and
            # dropping it sends the uninstaller looking in the wrong registry hive. Keep whatever
            # is there and add ours.
            $command = $entry.UninstallString
            if ($command -match '^"([^"]+)"\s*(.*)$') {
              $uninstaller = $Matches[1]
              $rest = $Matches[2]
            } else {
              $uninstaller = $command
              $rest = ''
            }
            $argv = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART')
            if ($rest) { $argv += ($rest -split '\s+' | Where-Object { $_ }) }
            Write-Host "running: $uninstaller $($argv -join ' ')"
            $un = Start-Process -FilePath $uninstaller -PassThru -ArgumentList $argv
            $un.WaitForExit()
            # Printed, not asserted. The per-user uninstaller runs Uninstall-UserNode.ps1 against
            # a machine whose scheduled task adoption already took away, which is a thing it is
            # allowed to find; the state left behind is asserted below instead.
            Write-Host "uninstaller exit code: $($un.ExitCode)"
            # Inno's uninstaller copies itself into TEMP and re-launches, so the process started
            # above returns long before the work is done, and the first process exits before its
            # TEMP copy has even started. One empty poll proves nothing: the quiet has to last.
            # Five consecutive empty polls, two seconds apart, is the bar.
            $settled = $false
            $quiet = 0
            for ($i = 0; $i -lt 150; $i++) {
              $running = @(Get-Process -ErrorAction SilentlyContinue |
                Where-Object { $_.ProcessName -like 'unins*' -or $_.ProcessName -like '_iu*' })
              if ($running.Count -eq 0) { $quiet++ } else { $quiet = 0 }
              if ($quiet -ge 5) { $settled = $true; break }
              Start-Sleep -Seconds 2
            }
            if (-not $settled) {
              Write-Host 'an uninstaller process was still running after 5 minutes:'
              Get-Process | Where-Object { $_.ProcessName -like 'unins*' -or $_.ProcessName -like '_iu*' } |
                ForEach-Object { Write-Host "  pid $($_.Id): $($_.ProcessName)" }
              $failures += "the uninstaller for $($entry.DisplayName) never settled"
            }
          }
          $gone = $false
          for ($i = 0; $i -lt 60; $i++) {
            if (-not (Get-Service -Name sukarfleet-node -ErrorAction SilentlyContinue)) { $gone = $true; break }
            Start-Sleep -Seconds 1
          }
          if (-not $gone) { $failures += 'service sukarfleet-node survived the cleanup uninstall' }
          if (Get-ScheduledTask -TaskName sukarfleet -ErrorAction SilentlyContinue) {
            $failures += 'scheduled task sukarfleet survived the cleanup uninstall'
          }
          # The machine-wide uninstall keeps the node directory on purpose, which is the
          # documented contract, so it is reported rather than asserted away.
          Write-Host "kept after cleanup: $nodeDir -> $(Test-Path -LiteralPath $nodeDir)"

          if ($failures.Count -gt 0) {
            foreach ($f in $failures) { Write-Host $f }
            exit 1
          }
          Write-Host 'a machine-wide install adopted the per-user node: preflight passed, service running, task gone, same identity'

      # A no-op until the secret exists, and that is the whole point of it being
      # here: the step is written, reviewed and skipped rather than invented in a
      # hurry on release day. SignPath is the route because Azure Trusted Signing
      # is not open to individuals outside the US and Canada, and a code-signing
      # certificate is the thing this project does not have. Until then the
      # EXE is unsigned, SmartScreen warns, and the SHA256 printed above is the
      # trust anchor: docs/PLATFORMS.md says so in those words.
      #
      # Signing happens after the upload because the action submits an artifact
      # that GitHub already holds. The hash above is therefore the unsigned one;
      # signing changes the bytes, so the release that ships a signed EXE pins
      # the hash of what it uploaded, not of what this run built.
      - name: sign the installer
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ env.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: sukarfleet
          signing-policy-slug: test-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.artifact.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signed
